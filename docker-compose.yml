services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - backend/.env

    container_name: resume-reviewer-backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: resume-reviewer-frontend

    ports:
      - "5173:5173"

    env_file:
      - frontend/.env